name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v5

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
      - name: 更新 deploy-repo
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="sha-${GITHUB_SHA::7}"

          git clone https://x-access-token:${DEPLOY_PAT}@github.com/amil233/zero-to-tech-deploy.git
          cd zero-to-tech-deploy/frontend/overlays/production

          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar xz
          ./kustomize edit set image ${IMAGE}=${IMAGE}:${TAG}

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "frontend: deploy ${TAG}"
          git push
